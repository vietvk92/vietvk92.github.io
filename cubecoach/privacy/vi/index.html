h1{font-size:28px;line-height:1.2;margin:0 0 8px}h2{font-size:20px;margin:32px 0 8px}a{color:var(--accent)}<nav><a href="../vi/" aria-current="page" lang="vi">Tiếng Việt</a><a href="../en/" lang="en">English</a></nav><h1>Chính sách quyền riêng tư — CubeCoach</h1>
<p><em>Cập nhật: 18/10/2026</em></p>
<p>CubeCoach hoạt động hoàn toàn ngoại tuyến. Trang này nói rõ ứng dụng làm gì và không làm gì với thông tin của bạn.</p>
<h2>Tóm tắt</h2>
<ul><li><strong>Không thu thập gì.</strong> Không dữ liệu cá nhân, không phân tích hành vi, không báo cáo lỗi gửi đi, không mã quảng cáo.</li>
<li><strong>Mọi thứ ở trên máy bạn.</strong> Tiến độ học, kết quả luyện tập, lịch sử timer, trạng thái khối đã nhập và cài đặt đều lưu cục bộ.</li>
<li><strong>Không tài khoản, không quảng cáo, không theo dõi.</strong> CubeCoach Plus (thuê bao hoặc mua một lần) do Apple xử lý. Chúng tôi không thấy thông tin thanh toán hay Apple Account của bạn; ứng dụng chỉ hỏi StoreKit trên máy xem Plus có đang hoạt động.</li>
<li>Chúng tôi không vận hành máy chủ nào.</li></ul>
<h2>Xử lý trên thiết bị</h2>
<p>Bộ giải khối, bài học, phân tích lỗi và các bước hướng dẫn chạy hoàn toàn trên máy.</p>
<h2>Camera</h2>
<p>Nếu bạn chọn quét khối, hình ảnh camera chỉ được xử lý trên máy để đọc màu các ô. Không ảnh hay video nào được lưu hoặc gửi đi. Bạn luôn có thể nhập khối bằng tay.</p>
<h2>Bên thứ ba</h2>
<p>Không dùng SDK phân tích, quảng cáo hay theo dõi của bên thứ ba.</p>
<h2>Trẻ em</h2>
<p>CubeCoach không thu thập dữ liệu cá nhân của bất kỳ ai, kể cả trẻ em; không có chat hay nội dung chia sẻ trực tuyến.</p>
<h2>Xóa dữ liệu</h2>
<p>Mọi dữ liệu nằm trên máy; xóa ứng dụng là xóa hết.</p>
<h2>Thay đổi</h2>
<p>Nếu chính sách thay đổi, bản mới sẽ được đăng tại địa chỉ này kèm ngày cập nhật.</p>
<h2>Liên hệ</h2>
<p>Thinkling Studio — mở issue tại <a href="https://github.com/vietvk92/vietvk92.github.io/issues">github.com/vietvk92/vietvk92.github.io/issues</a>.</p></main></body></html>
