h1{font-size:28px;line-height:1.2;margin:0 0 8px}h2{font-size:20px;margin:32px 0 8px}a{color:var(--accent)}<nav><a href="../vi/" lang="vi">Tiếng Việt</a><a href="../en/" aria-current="page" lang="en">English</a></nav><h1>Privacy Policy — CubeCoach</h1>
<p><em>Last updated: 2026-10-18</em></p>
<p>CubeCoach: Learn the Cube works entirely offline. This page explains exactly what the app does, and does not do, with your information.</p>
<h2>Summary</h2>
<ul><li><strong>We collect nothing.</strong> No personal data, analytics, telemetry, crash reports or advertising identifiers.</li>
<li><strong>Everything stays on your device.</strong> Learning progress, practice results, timer history, entered cube states and settings are stored locally.</li>
<li><strong>No accounts, no ads, no tracking.</strong> CubeCoach Plus (subscription or one-time purchase) is processed entirely by Apple. We never see your payment details or Apple Account; the app only asks StoreKit on your device whether Plus is active.</li>
<li>We run no server of our own.</li></ul>
<h2>On-device processing</h2>
<p>The cube solver, lessons, mistake analysis and coach steps run entirely on your device.</p>
<h2>Camera</h2>
<p>If you choose to scan your cube, camera frames are processed on the device only to sample sticker colours. No photo or video is saved or transmitted. You can always enter the cube by hand instead.</p>
<h2>Third parties</h2>
<p>No third-party analytics, advertising or tracking SDKs.</p>
<h2>Children's privacy</h2>
<p>CubeCoach collects no personal data from anyone, including children, and has no chat or user-generated content shared online.</p>
<h2>Deleting your data</h2>
<p>All data lives on your device; deleting the app deletes it.</p>
<h2>Changes</h2>
<p>If this policy changes, the updated version will be posted at this URL with a new date.</p>
<h2>Contact</h2>
<p>Thinkling Studio — open an issue at <a href="https://github.com/vietvk92/vietvk92.github.io/issues">github.com/vietvk92/vietvk92.github.io/issues</a>.</p></main></body></html>
